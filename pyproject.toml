[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papermind"
version = "0.1.0"
description = "Research-paper retrieval and question answering with LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "langgraph>=1.2.4,<2",
    "langchain>=1.3.7,<2",
    "langchain-core>=1.5.3,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "langchain-openai>=1.4.1,<2",
    "langchain-chroma>=1.1.0,<2",
    "sentence-transformers>=5.5.1,<6",
    "PyMuPDF>=1.27.2.3,<2",
    "python-dotenv>=1.2.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]
elasticsearch = ["langchain-elasticsearch"]
pinecone = ["langchain-pinecone"]
mongodb = ["langchain-mongodb"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["chunk_graph*", "index_graph*", "retrieval_graph*", "shared*"]

